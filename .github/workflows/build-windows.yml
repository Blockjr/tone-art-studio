name: build
on: [workflow_dispatch]
permissions:
  contents: write
env:
  ZIP: https://litter.catbox.moe/rbgvdf.zip
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - shell: pwsh
        run: |
          Invoke-WebRequest -Uri $env:ZIP -OutFile s.zip
          Expand-Archive -Path s.zip -DestinationPath work -Force
      - shell: pwsh
        run: pwsh -NoProfile -File work/installer/build-installer.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: setup
          path: work/dist-installer/*.exe
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.0.${{ github.run_number }}
          files: work/dist-installer/*.exe
