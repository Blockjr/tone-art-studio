name: native-core

# The JUCE-free part of the native engine: the mixer (per-track insert chains,
# gain, pan, mute/solo, the master chain) and the virtual ASIO driver's
# shared-memory ring protocol. Both compile and run anywhere, so every change to
# them is checked here before the Windows host and driver are built.
#
# What this cannot check is audio reaching a real ASIO host, which needs Windows,
# an elevated session and a second application. Everything up to that boundary is
# covered here.

on:
  push:
    paths:
      - "native/Core/**"
      - "native/Source/HybridAsioShared.h"
      - "native/tests/**"
      - ".github/workflows/native-core.yml"
  pull_request:
    paths:
      - "native/Core/**"
      - "native/Source/HybridAsioShared.h"
      - "native/tests/**"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Build and run the mix-graph tests
        run: native/Core/build-tests.sh

      - name: Build and run the virtual ASIO ring-protocol tests
        run: bash native/tests/build-tests.sh
