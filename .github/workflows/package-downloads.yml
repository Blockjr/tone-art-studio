name: package-downloads

# Packs the four delivery zips around the installer that is already published
# and attaches them to the v0.1.0 release. The installer is fetched from the
# release asset and checked against a pinned SHA-256 first, so a stale exe can
# never be packed inside the kit.

on:
  workflow_dispatch:

permissions:
  contents: write

env:
  EXE: ToneArtStudioSetup-0.1.0.exe
  EXE_SHA: 0a1b070784a144ea9de76cbfed56967e8573c041a5b1db2c411c2fb9f834defb

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Fetch and verify the published installer
        run: |
          set -euo pipefail
          mkdir -p build/exe
          curl -sSL -o "build/exe/$EXE" \
            "https://github.com/$GITHUB_REPOSITORY/releases/download/v0.1.0/$EXE"
          echo "$EXE_SHA  build/exe/$EXE" | sha256sum -c -

      - name: Build the web UI
        run: npm ci && npm run build

      - name: Assemble the zips
        run: |
          set -euo pipefail
          ws=$GITHUB_WORKSPACE
          out=$ws/build/out
          exe=$ws/build/exe/$EXE
          mkdir -p "$out"

          d=$ws/build/1/ToneArtStudio-1-App-Installer
          mkdir -p "$d"
          cp "$exe" "$d/"
          printf '%s\r\n' \
            'TONE ART STUDIO 0.1.0 - WINDOWS APP' \
            '' \
            '1. Double-click ToneArtStudioSetup-0.1.0.exe.' \
            '2. If Windows says "Windows protected your PC", click More info, then Run anyway.' \
            '3. Click Next through the wizard. Leave the audio driver task ticked.' \
            '4. Start "Tone Art Studio" from the Start menu or the Desktop icon.' \
            '' \
            'The app runs locally: no account, no sign-in, no internet needed.' \
            > "$d/INSTALL-WINDOWS.txt"
          printf '%s  %s\n' "$EXE_SHA" "$EXE" > "$d/SHA256.txt"
          (cd "$ws/build/1" && zip -qr "$out/ToneArtStudio-1-App-Installer.zip" .)

          mkdir -p "$ws/build/2"
          cp -r "$ws/remote-kit" "$ws/build/2/ToneArtStudio-Desktop"
          cp "$exe" "$ws/build/2/ToneArtStudio-Desktop/"
          (cd "$ws/build/2" && zip -qr "$out/ToneArtStudio-2-Desktop-and-Remote-Kit.zip" .)

          git archive --format=zip --prefix=Tone-Art-Studio-0.1.0/ \
            -o "$out/ToneArtStudio-3-Source-Code.zip" HEAD

          mkdir -p "$ws/build/4"
          cp -r "$ws/dist" "$ws/build/4/ToneArtStudio-Web"
          rm -rf "$ws/build/4/ToneArtStudio-Web/download"
          printf '%s\r\n' \
            'TONE ART STUDIO 0.1.0 - WEB BUILD' \
            '' \
            'A static site. Serve it over HTTP from this directory, not file://:' \
            '' \
            '  npx serve .' \
            '' \
            'Then open the address it prints.' \
            > "$ws/build/4/ToneArtStudio-Web/README.txt"
          (cd "$ws/build/4" && zip -qr "$out/ToneArtStudio-4-Web-Build.zip" .)

          (cd "$out" && zip -q -0 ToneArtStudio-ALL.zip ToneArtStudio-1-App-Installer.zip ToneArtStudio-2-Desktop-and-Remote-Kit.zip ToneArtStudio-3-Source-Code.zip ToneArtStudio-4-Web-Build.zip)
          (cd "$out" && sha256sum *.zip "$exe" > SHA256.txt && cat SHA256.txt && ls -l)

      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release upload v0.1.0 build/out/*.zip build/out/SHA256.txt --clobber
          gh release view v0.1.0 --json assets --jq '.assets[] | "\(.name)  \(.size)"'
