name: package-downloads

# Packs the complete delivery set around the installers that are already
# published and attaches it to that release.
#
# Nothing here pins a version. The tag, the file names and the hashes all come
# from package.json and the release's own SHA256SUMS.txt, so a run after any
# release packs that release.
#
# Four mistakes this file has already made and must not make again:
#
#   - it hardcoded the 0.1.0 tag, name and hash, so it could only ever rebuild
#     one old release;
#   - ALL.zip only contained the app, so the "everything" download was missing
#     the native engine (ASIO, VST3, the driver) and the driver on its own;
#   - it downloaded and hashed by wildcard, which swept the bundle zips from
#     earlier runs into the new sums file as duplicate lines with stale hashes,
#     so `sha256sum -c` failed on good downloads;
#   - it only ran when somebody dispatched it by hand, so the installers were
#     re-published at 15:19 while ToneArtStudio-ALL.zip still carried the 14:54
#     build: the "everything" download was one build behind the files sitting
#     next to it on the same release page.
#
# That last one is why this job now starts by itself: it runs when the job that
# publishes the installers finishes, so the bundles cannot lag the release they
# describe.

on:
  workflow_run:
    workflows: [native-windows, publish-setup]
    types: [completed]
  workflow_dispatch:

# native-windows and this job share one queue, so a bundle cannot be assembled
# out of a release that is halfway through being replaced.
concurrency:
  group: tone-art-release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  package:
    # A hand dispatch, or a run that pushed a new release. Never a pull request
    # (those publish nothing) and never a failed build (nothing new to pack).
    if: >-
      github.event_name == 'workflow_dispatch'
      || (github.event.workflow_run.conclusion == 'success'
          && github.event.workflow_run.event != 'pull_request')
    runs-on: ubuntu-latest
    steps:
      # The builds being packed are the ones the triggering run produced, so the
      # source zip and the web build have to come from that same commit. A hand
      # dispatch has no triggering run and packs the default branch.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      # 24, not 20: package.json declares >= 22.12 and every dependency built
      # here needs it. The pin sat at 20 while the toolchain moved on, which this
      # job's own log showed as EBADENGINE warnings.
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Fetch and verify every published build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version=$(node -p "require('./package.json').version")
          tag="v$version"
          app="ToneArtStudioSetup-$version.exe"
          host="ToneArtStudioHostSetup-$version.exe"
          driver="ToneArtVirtualAsio-$version.zip"

          {
            echo "VERSION=$version"
            echo "TAG=$tag"
            echo "APP=$app"
            echo "HOST=$host"
            echo "DRIVER=$driver"
          } >> "$GITHUB_ENV"

          # Download the three installers by name, never by a ToneArtStudio*
          # wildcard: that also matches the bundle zips this job published on an
          # earlier run, and hashing those into the new sums file produces
          # duplicate lines with stale hashes - which makes `sha256sum -c` fail
          # on a perfectly good download.
          mkdir -p build/exe
          gh release download "$tag" --pattern "$app"  --dir build/exe
          gh release download "$tag" --pattern "$host" --dir build/exe
          gh release download "$tag" --pattern "$driver" --dir build/exe \
            || echo "::warning::$driver is not attached to $tag"
          gh release download "$tag" --pattern 'SHA256SUMS.txt' --dir build/exe

          # Windows writes the sums file with CRLF endings. Strip them once, here,
          # so every later read is a plain grep against a file name: an anchored
          # `grep 'name$'` never matches "name\r", and under `pipefail` a grep
          # that matches nothing fails the whole step - which is exactly how an
          # earlier version of this job died without saying why.
          tr -d '\r' < build/exe/SHA256SUMS.txt > build/exe/SHA256SUMS.unix.txt

          # The native engine and the app are both the product: one is the ASIO
          # DAW, the other is the interface and the tablet remote. Either one
          # missing means the bundle would be incomplete, so this fails here.
          for required in "$app" "$host"; do
            if [ ! -f "build/exe/$required" ]; then
              echo "::error::$tag does not carry $required, so the bundle would be incomplete"
              exit 1
            fi
          done

          # The release's own sums file is the source of truth here, which is why
          # this cannot disagree with the hash a user would read on the release.
          sums=build/exe/SHA256SUMS.unix.txt

          for file in "$app" "$host" "$driver"; do
            if [ -f "build/exe/$file" ]; then
              grep -F "  $file" "$sums" | ( cd build/exe && sha256sum -c - )
            else
              echo "::warning::$file is not in $tag; the bundle notes it is unavailable"
            fi
          done
          ls -l build/exe

      - name: Build the web UI
        run: npm ci --no-audit --no-fund && npm run build

      - name: Assemble the zips
        run: |
          set -euo pipefail
          ws=$GITHUB_WORKSPACE
          out=$ws/build/out
          exe=$ws/build/exe/$APP
          mkdir -p "$out"

          # ---- 1. the app installer -------------------------------------------
          d=$ws/build/1/ToneArtStudio-1-App-Installer
          mkdir -p "$d"
          cp "$exe" "$d/"
          printf '%s\r\n' \
            "TONE ART STUDIO $VERSION - WINDOWS APP" \
            '' \
            "1. Double-click $APP." \
            '2. If Windows says "Windows protected your PC", click More info, then Run anyway.' \
            '3. Click Next through the wizard.' \
            '4. Start "Tone Art Studio" from the Start menu or the Desktop icon.' \
            '' \
            'The app runs locally: no account, no sign-in, no internet needed.' \
            '' \
            'FOR ASIO: install the engine from ToneArtStudio-5-Engine-ASIO-Driver.zip' \
            'as well. This app plays through its own browser engine; the engine is' \
            'the one that opens an ASIO device and hosts VST3 plugins.' \
            > "$d/INSTALL-WINDOWS.txt"
          grep -F "  $APP" "$ws/build/exe/SHA256SUMS.unix.txt" > "$d/SHA256.txt"
          (cd "$ws/build/1" && zip -qr "$out/ToneArtStudio-1-App-Installer.zip" .)

          # ---- 2. the desktop kit: app + tablet remote + both icons -----------
          # The kit is shipped without an installer on purpose: its setup script
          # downloads the newest published one. Dropping this release's copy
          # beside it means the double-click flow works offline as well.
          mkdir -p "$ws/build/2"
          cp -r "$ws/remote-kit" "$ws/build/2/ToneArtStudio-Desktop"
          cp "$exe" "$ws/build/2/ToneArtStudio-Desktop/"
          (cd "$ws/build/2" && zip -qr "$out/ToneArtStudio-2-Desktop-and-Remote-Kit.zip" .)

          # ---- 3. the source ---------------------------------------------------
          git archive --format=zip --prefix="Tone-Art-Studio-$VERSION/" \
            -o "$out/ToneArtStudio-3-Source-Code.zip" HEAD

          # ---- 4. the browser build -------------------------------------------
          mkdir -p "$ws/build/4"
          cp -r "$ws/dist" "$ws/build/4/ToneArtStudio-Web"
          rm -rf "$ws/build/4/ToneArtStudio-Web/download"
          printf '%s\r\n' \
            "TONE ART STUDIO $VERSION - WEB BUILD" \
            '' \
            'A static site. Serve it over HTTP from this directory, not file://:' \
            '' \
            '  npx serve .' \
            '' \
            'Then open the address it prints.' \
            > "$ws/build/4/ToneArtStudio-Web/README.txt"
          (cd "$ws/build/4" && zip -qr "$out/ToneArtStudio-4-Web-Build.zip" .)

          # ---- 5. the engine: ASIO, VST3 and the driver ------------------------
          d=$ws/build/5/ToneArtStudio-5-Engine-ASIO-Driver
          mkdir -p "$d"
          cp "$ws/build/exe/$HOST" "$d/"
          if [ -f "$ws/build/exe/$DRIVER" ]; then
            cp "$ws/build/exe/$DRIVER" "$d/"
          fi
          printf '%s\r\n' \
            "TONE ART STUDIO $VERSION - NATIVE ENGINE (ASIO)" \
            '' \
            "1. Double-click $HOST." \
            '2. If Windows says "Windows protected your PC", click More info, then Run anyway.' \
            '3. Accept the UAC prompt. Administrator rights are required: the virtual' \
            '   ASIO driver registers itself machine-wide.' \
            '4. Leave the audio driver task ticked. That registers the device' \
            '   "Tone Art Virtual ASIO".' \
            '' \
            'This is the ASIO build: a real input/output device, VST3 hosting, and' \
            'the Tone Art Gate plugin. It draws the same interface as the app.' \
            '' \
            "The driver on its own is $DRIVER, for a DAW you already use." \
            > "$d/INSTALL-ENGINE.txt"
          grep -E "  ($HOST|$DRIVER)$" "$ws/build/exe/SHA256SUMS.unix.txt" > "$d/SHA256.txt"
          # An empty sums file would mean the engine and the driver were packed
          # without a way to check them, so say so instead of shipping it.
          if [ ! -s "$d/SHA256.txt" ]; then
            echo "::error::no sums matched $HOST or $DRIVER, so the engine zip cannot be verified"
            exit 1
          fi
          (cd "$ws/build/5" && zip -qr "$out/ToneArtStudio-5-Engine-ASIO-Driver.zip" .)

          # ---- everything -----------------------------------------------------
          (cd "$out" && zip -q -0 ToneArtStudio-ALL.zip \
            ToneArtStudio-1-App-Installer.zip \
            ToneArtStudio-2-Desktop-and-Remote-Kit.zip \
            ToneArtStudio-3-Source-Code.zip \
            ToneArtStudio-4-Web-Build.zip \
            ToneArtStudio-5-Engine-ASIO-Driver.zip)

          # One sums file for the whole release: the three installers and every
          # bundle zip, each hashed from the file that is about to be uploaded,
          # so `sha256sum -c SHA256SUMS.txt` checks any download from one place.
          #
          # It is built from scratch and never appended to, and there is no
          # second sums file, because two of them is how a stale one survived:
          # the other still listed the installers of the build that this one
          # replaced.
          #
          # Bare file names only, and never a wildcard: a sums file has to be
          # usable with `sha256sum -c` from the folder the files are in, and the
          # folder it is built from also holds the release's own SHA256SUMS.txt
          # and the CR-stripped copy of it, which are not downloads.
          {
            (cd "$ws/build/exe" && sha256sum "$APP" "$HOST")
            if [ -f "$ws/build/exe/$DRIVER" ]; then
              (cd "$ws/build/exe" && sha256sum "$DRIVER")
            fi
            (cd "$out" && sha256sum *.zip)
          } > "$out/SHA256SUMS.txt"
          cat "$out/SHA256SUMS.txt" && ls -l "$out"

      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release upload "$TAG" build/out/*.zip build/out/SHA256SUMS.txt --clobber

          # The old second sums file listed the installers that existed when it
          # was written. Those files were replaced afterwards, so it named hashes
          # that are not on the release any more, and nothing published may point
          # at something that no longer exists. An asset that is not there is
          # not an error.
          gh release delete-asset "$TAG" SHA256.txt --yes || true

          gh release view "$TAG" --json assets --jq '.assets[] | "\(.name)  \(.size) bytes  \(.digest)"'
