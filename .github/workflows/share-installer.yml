name: share-installer
on: workflow_dispatch
permissions:
  contents: write
jobs:
  share:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Publish a public copy of the installer
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -x
          mkdir -p out
          gh release download v0.1.0 --pattern '*.exe' --dir out --clobber
          file=$(ls out/*.exe | head -1)
          sha=$(sha256sum "$file" | cut -d' ' -f1)
          echo "asset sha: $sha"
          cd out && zip -q -9 ToneArtStudioSetup-0.1.0.zip "$(basename "$file")" && cd ..
          url=$(curl -sS -A 'Mozilla/5.0 tone-art-studio' -F "file=@out/ToneArtStudioSetup-0.1.0.zip" https://0x0.st || true)
          echo "0x0: $url"
          case "$url" in
            https://*) ;;
            *)
              meta=$(curl -sS -T out/ToneArtStudioSetup-0.1.0.zip https://pixeldrain.com/api/file/ || true)
              echo "pixeldrain: $meta"
              id=$(echo "$meta" | sed -n 's/.*"id":"\([^"]*\)".*/\1/p')
              if [ -n "$id" ]; then url="https://pixeldrain.com/api/file/$id?download"; fi
              ;;
          esac
          echo "FINAL=$url"
          { echo "$url"; echo "$sha"; } > installer-link.txt
          cat installer-link.txt
      - name: Commit the link so the app can read it
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add installer-link.txt
          git commit -m 'Record the public installer link' || true
          git push
