name: share-installer
on: workflow_dispatch
permissions:
  contents: write
jobs:
  share:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch the built installer
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p out
          gh release download v0.1.0 --pattern '*.exe' --dir out --clobber
          ls -l out
          sha256sum out/*.exe
      - name: Commit the installer so it can be re-hosted
        run: |
          mkdir -p installer-dist
          cp out/*.exe installer-dist/ToneArtStudioSetup-0.1.0.exe
          sha256sum installer-dist/*.exe | cut -d' ' -f1 > installer-dist/SHA256.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f installer-dist
          git commit -m 'Stage the 0.1.0 installer for public download' || true
          git push
