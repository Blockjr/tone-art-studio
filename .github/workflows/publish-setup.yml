name: publish-setup

# Takes the setup program from the newest native-windows run that uploaded the
# `tone-art-studio-setup` artifact and publishes it as the release asset for the
# version in package.json.
#
# It exists because native-windows fails on its very last step only:
# `gh release upload --clobber` reports an error while the build, the driver,
# the VST3 and the installer have all already been produced and uploaded as
# artifacts. Re-running this job reuses that build instead of paying for another
# nine-minute MSVC pass.
#
# The repository copy is skipped for anything over GitHub's 100 MB file limit:
# the installed app carries a browser engine, so the setup program has been
# around 116 MB since 0.2.0 and can only be published as a release asset.

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Fetch the setup program from the newest usable build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # The run that carries the artifact is not necessarily the newest one
          # with a green tick: `native-windows` builds first and publishes last,
          # so a failed publish step still leaves a complete installer behind.
          run=""
          for id in $(gh run list --workflow native-windows.yml --limit 8 \
                        --json databaseId --jq '.[].databaseId'); do
            if gh run download "$id" --name tone-art-studio-setup --dir /tmp/out 2>/dev/null; then
              run="$id"
              break
            fi
          done
          if [ -z "$run" ]; then
            echo '::error::no native-windows run has a tone-art-studio-setup artifact'
            exit 1
          fi
          echo "build run: $run"
          find /tmp/out -type f -printf '%s  %p\n'

      - name: Publish it as the release asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          exe=$(find /tmp/out -type f -name '*.exe' -print -quit)
          if [ -z "$exe" ]; then
            echo '::error::the artifact did not contain a setup program'
            exit 1
          fi
          echo "setup program: $exe ($(stat -c%s "$exe") bytes)"
          sha256sum "$exe"
          version=$(node -p "require('./package.json').version")
          tag="v$version"
          echo "publishing into $tag"
          gh release view "$tag" > /dev/null 2>&1 \
            || gh release create "$tag" --title "Tone Art Studio $version" \
                 --notes "Windows build of Tone Art Studio $version: the desktop app, the bundled Tone Art Gate VST3 and the virtual ASIO driver."
          gh release upload "$tag" "$exe" --clobber
          gh release view "$tag" --json assets \
            --jq '.assets[] | "\(.name)  \(.size) bytes  \(.digest)"'

      - name: Keep a copy in the repository when it fits
        run: |
          set -euo pipefail
          exe=$(find /tmp/out -type f -name '*.exe' -print -quit)
          size=$(stat -c%s "$exe")
          version=$(node -p "require('./package.json').version")
          if [ "$size" -gt 95000000 ]; then
            echo "::notice::the setup program is $size bytes, over GitHub's 100 MB file limit; the release asset is the download"
            exit 0
          fi
          mkdir -p installer-dist
          cp "$exe" "installer-dist/ToneArtStudioSetup-$version.exe"
          git config user.name 'Tone Art Studio build'
          git config user.email 'build@users.noreply.github.com'
          git add -A installer-dist
          if git diff --cached --quiet; then
            echo '::notice::the repository copy is already the current build'
          else
            git commit -m 'Refresh the built Windows installer'
            git push
          fi
