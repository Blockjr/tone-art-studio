name: publish-setup

# Takes the setup program from the newest successful native-windows run and
# publishes it: as the release asset, and as a copy inside the repository.
#
# It exists because native-windows itself failed on its last step only:
# `gh release upload --clobber` reported an error while the build, the driver,
# the VST3 and the installer had all already been produced and uploaded as
# artifacts. Re-running this job reuses that build instead of paying for
# another nine-minute MSVC pass.

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Fetch the setup program from the newest successful build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          run=$(gh run list --workflow native-windows.yml --status success --limit 1 \
                  --json databaseId --jq '.[0].databaseId')
          echo "build run: $run"
          rm -rf /tmp/out && mkdir -p /tmp/out
          gh run download "$run" --name tone-art-studio-setup --dir /tmp/out
          find /tmp/out -type f -printf '%s  %p\n'

      - name: Publish it as the release asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          exe=$(find /tmp/out -type f -name '*.exe' -print -quit)
          if [ -z "$exe" ]; then
            echo '::error::the artifact did not contain a setup program'
            exit 1
          fi
          echo "setup program: $exe ($(stat -c%s "$exe") bytes)"
          sha256sum "$exe"
          gh release view v0.1.0 > /dev/null 2>&1 \
            || gh release create v0.1.0 --title 'Tone Art Studio 0.1.0' --notes 'Windows build of Tone Art Studio 0.1.0.'
          gh release upload v0.1.0 "$exe" --clobber
          gh release view v0.1.0 --json assets --jq '.assets[] | "\(.name)  \(.size) bytes  \(.digest)"'

      - name: Keep a copy in the repository
        run: |
          set -euo pipefail
          exe=$(find /tmp/out -type f -name '*.exe' -print -quit)
          mkdir -p installer-dist
          cp "$exe" installer-dist/ToneArtStudioSetup-0.1.0.exe
          git config user.name 'Tone Art Studio build'
          git config user.email 'build@users.noreply.github.com'
          git add -A installer-dist
          if git diff --cached --quiet; then
            echo '::notice::the repository copy is already the current build'
          else
            git commit -m 'Refresh the built Windows installer'
            git push
          fi
