name: publish-setup

# Publishes everything the newest usable native-windows build produced:
#
#   ToneArtStudioSetup-<version>.exe        the installed desktop app
#   ToneArtStudioHostSetup-<version>.exe    the native engine: ASIO, VST3, driver
#   ToneArtVirtualAsio-<version>.zip        the driver on its own
#   SHA256SUMS.txt                          the hashes of all of them
#
# It exists because native-windows fails on its very last step only:
# `gh release upload --clobber` reports an error while the build, the driver, the
# VST3 and both installers have all already been produced and uploaded as
# artifacts. Re-running this job reuses that build instead of paying for another
# nine-minute MSVC pass.
#
# Nothing here is copied into the repository. The built files are release assets
# only: a copy committed to the tree is a fixed version that goes stale and gets
# handed to someone as "the app" long after it stopped being current, which is
# what .gitignore says about installers too.

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Fetch the builds from the newest usable run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # The run that carries the artifacts is not necessarily the newest one
          # with a green tick: `native-windows` builds first and publishes last,
          # so a failed publish step still leaves complete installers behind.
          app_run=""
          host_run=""
          for id in $(gh run list --workflow native-windows.yml --limit 8 \
                        --json databaseId --jq '.[].databaseId'); do
            if [ -z "$app_run" ] && gh run download "$id" --name tone-art-studio-setup --dir /tmp/app 2>/dev/null; then
              app_run="$id"
            fi
            if [ -z "$host_run" ] && gh run download "$id" --name tone-art-host-setup --dir /tmp/host 2>/dev/null; then
              host_run="$id"
            fi
            if [ -n "$app_run" ] && [ -n "$host_run" ]; then break; fi
          done

          if [ -z "$app_run" ]; then
            echo '::error::no native-windows run has a tone-art-studio-setup artifact'
            exit 1
          fi
          echo "app build run:  $app_run"
          echo "host build run: ${host_run:-none}"
          test -d /tmp/app && find /tmp/app -type f -printf '%s  %p\n'
          test -d /tmp/host && find /tmp/host -type f -printf '%s  %p\n'

      - name: Publish them as release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version=$(node -p "require('./package.json').version")
          tag="v$version"
          echo "publishing into $tag"
          gh release view "$tag" > /dev/null 2>&1 \
            || gh release create "$tag" --title "Tone Art Studio $version" \
                 --notes "Windows builds of Tone Art Studio $version. ToneArtStudioSetup is the installed desktop app. ToneArtStudioHostSetup is the native engine: ASIO, VST3 hosting and the Tone Art Virtual ASIO driver. ToneArtVirtualAsio is the driver on its own, for another DAW."

          files=()
          while IFS= read -r -d '' file; do files+=("$file"); done \
            < <(find /tmp/app /tmp/host -type f \( -name '*.exe' -o -name '*.zip' \) -print0 2>/dev/null)

          if [ ${#files[@]} -eq 0 ]; then
            echo '::error::the artifacts did not contain any installers'
            exit 1
          fi

          {
            for file in "${files[@]}"; do
              echo "$(sha256sum "$file" | cut -d' ' -f1)  $(basename "$file")"
            done
          } | tee /tmp/SHA256SUMS.txt
          files+=(/tmp/SHA256SUMS.txt)

          printf 'uploading:\n'
          printf '  %s\n' "${files[@]}"
          gh release upload "$tag" "${files[@]}" --clobber
          gh release view "$tag" --json assets \
            --jq '.assets[] | "\(.name)  \(.size) bytes  \(.digest)"'
